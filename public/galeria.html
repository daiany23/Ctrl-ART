<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="utf-8">
    <title>Ctrl + ART Galeria</title>
    <link rel="icon" href="img/logo.png">
    <link href="css/style.css" rel="stylesheet">
</head>



<body>
    <!-- Ara crearem el header-->
    <header>
        <!-- Fiquem el logo a la part superior esquerra-->
        <div class="logo">
            <img src="img/logo.png" alt="Logo CTRL+ART">
        </div>

        <!--Seguidament, creem el menú de navegació-->
        <nav id="nav-menu">
            <ul>
                <li><a href=index.html>Inici</a></li>
                <li><a href=index.html#dates>Dates</a></li>
                <li><a href=index.html#sponsors>Sponsors</a></li>
                <li><a href=galeria.html>Galeria</a></li>
                <li><a href=faq.html>FAQ</a></li>
                <li><a href=contacte.html>Contacte</a></li>
                <li><a href=registre.html>Registre</a></li>
            </ul>
        </nav>
    </header>

    <!--GALERIA SLIDER-->
    <section class = "galeria-slider">
        <h1>GALERIA</h1>

        <div class="slider">
            <div class="slides">

                <!--IMATGES DEL SLIDER-->
                <img src="img/galeria1.png" alt="Imatge 1">
                <img src="img/galeria2.png" alt="Imatge 2">
                <img src="img/galeria3.png" alt="Imatge 3">
                <img src="img/galeria4.png" alt="Imatge 4">
                <img src="img/galeria5.png" alt="Imatge 5">

            </div>
        </div>

    </section>

    <!--GALERIA 2X2-->
    <section class="galeria-grid">
        <h2>ESDEVENIMENTS ANTERIORS</h2>

        <div class="grid-2x2">
            <img src="img/event1.jpg" alt="Event 1">
            <img src="img/event2.jpg" alt="Event 2">
            <img src="img/event3.jpg" alt="Event 3">
            <img src="img/event4.jpg" alt="Event 4">
        </div>

    </section>
    
    <div id="gallery-modal" class="gallery-modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modal-img" src="" alt="Imatge ampliada">
    </div>

    <!--FOOTER-->
    <!--Ara fem el peu de pàgina que apareixerà sempre-->
    <footer>
        <div class="footer-container">

            <!--Xarxes socials-->
            <div class="xarxes-socials">
                <a href="https://www.instagram.com" target="_blank">
                    <img src="img/instagram.png" alt="Instagram">
                </a>
                <a href="https://www.whatsapp.com" target="_blank">
                    <img src="img/whatsapp.png" alt="Whatsapp">
                </a>
                <a href="https://www.linkedin.com" target="_blank">
                    <img src="img/Linkedin.png" alt="Linkedin">
                </a>
                <a href="https://www.youtube.com" target="_blank">
                    <img src="img/youtube.png" alt="Youtube">
                </a>
                <a href="https://www.tiktok.com" target="_blank">
                    <img src="img/TikTok.png" alt="TikTok">
                </a>
            </div>

            <!--Enllaços legals-->
            <div class="legal">
                <a href=termes.html>Termes i condicions</a>
                <a href=cookies.html>Política de Cookies</a>
                <a href=privadesa.html>Política de Privadesa</a>
            </div>

            <!--Crèdits (copyright)-->
            <div class="crèdits">
                <p>&copy;2026 Ctrl + ART. Tots els drets reservats</p>
                <p>Esdeveniment creat per Jessica Talpa i Daiany Torralba</p>
            </div>
        </div>
    </footer>

    <script src="js/validacio.js"></script>

</body>

</html>
